<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SehrAn Media Admin</title>
<style>body{font-family:Arial;background:#08040c;color:#fff;padding:25px}.bar{display:flex;gap:10px;margin-bottom:20px}input,button{padding:11px;border-radius:8px;border:1px solid #444;background:#111;color:#fff}button{cursor:pointer}.ok{background:#0b7d3b}.no{background:#9c173e}.card{border:1px solid #333;border-radius:12px;padding:16px;margin:10px 0;background:#120a18}.muted{color:#aaa}</style></head>
<body><h1>SehrAn Media — Orders</h1><div class="bar"><input id="key" placeholder="Admin key"><button onclick="load()">Load Orders</button></div><div id="orders"></div>
<script>
async function load(){const key=document.getElementById('key').value;localStorage.adminKey=key;const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});const a=await r.json();if(!r.ok)return alert(a.error);document.getElementById('orders').innerHTML=a.map(o=>`<div class="card"><b>${o.orderId}</b> — ${o.status}<br><br>Name: ${o.name}<br>Instagram: ${o.username}<br>Profile: ${o.profile}<br>Package: ${o.package}<br>UTR: ${o.utr}<br><span class="muted">${o.createdAt}</span><br><br>${o.status==='PENDING'?`<button class="ok" onclick="setStatus('${o.orderId}','ACCEPTED')">ACCEPT</button> <button class="no" onclick="setStatus('${o.orderId}','REJECTED')">REJECT</button>`:''}</div>`).join('')||'<p>No orders.</p>'}
async function setStatus(id,status){const key=localStorage.adminKey;await fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'x-admin-key':key,'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
</script></body></html>
