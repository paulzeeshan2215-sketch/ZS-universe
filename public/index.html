<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SehrAn Media — Permanently Closed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,0.045) 0%,
            rgba(255,255,255,0.015) 28%,
            transparent 62%
        ),
        linear-gradient(
            135deg,
            #030303 0%,
            #080808 45%,
            #020202 100%
        );
}

.background::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.055) 0%,
            rgba(255,255,255,0.018) 30%,
            transparent 70%
        );
    filter:blur(35px);
    animation:
        ambientPulse 6s ease-in-out infinite;
}

.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,0.012) 50%,
            transparent 100%
        );
    opacity:.7;
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    box-shadow:0 0 8px rgba(255,255,255,.25);
    animation:floatParticle linear infinite;
}

.particle:nth-child(1){
    left:8%;
    top:20%;
    animation-duration:8s;
    animation-delay:-2s;
}

.particle:nth-child(2){
    left:18%;
    top:72%;
    animation-duration:11s;
    animation-delay:-5s;
}

.particle:nth-child(3){
    left:31%;
    top:14%;
    animation-duration:9s;
    animation-delay:-4s;
}

.particle:nth-child(4){
    left:47%;
    top:82%;
    animation-duration:12s;
    animation-delay:-7s;
}

.particle:nth-child(5){
    left:63%;
    top:18%;
    animation-duration:10s;
    animation-delay:-3s;
}

.particle:nth-child(6){
    left:78%;
    top:68%;
    animation-duration:9s;
    animation-delay:-6s;
}

.particle:nth-child(7){
    left:91%;
    top:31%;
    animation-duration:13s;
    animation-delay:-8s;
}

.particle:nth-child(8){
    left:72%;
    top:88%;
    animation-duration:10s;
    animation-delay:-1s;
}

.particle:nth-child(9){
    left:13%;
    top:46%;
    animation-duration:14s;
    animation-delay:-9s;
}

.particle:nth-child(10){
    left:84%;
    top:51%;
    animation-duration:8s;
    animation-delay:-3s;
}

/* =========================
   MAIN
========================= */

.page{
    position:relative;
    z-index:5;

    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px 24px;
}

/*
   IMPORTANT:
   Everything is centered from the same parent.
   No left/right offset is applied.
*/

.content{
    width:100%;
    max-width:760px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    animation:
        contentEnter 1.4s cubic-bezier(.22,1,.36,1) both;
}

/* =========================
   HEART AREA
========================= */

.heart-wrapper{
    position:relative;

    width:190px;
    height:190px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:36px;

    animation:
        heartFloat 4.5s ease-in-out infinite;
}

.heart-glow{
    position:absolute;

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,.035) 35%,
            transparent 72%
        );

    filter:blur(12px);

    animation:
        heartGlow 3.5s ease-in-out infinite;
}

.heart{
    position:relative;

    width:108px;
    height:96px;

    transform:rotate(-45deg);

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.08))
        drop-shadow(0 18px 28px rgba(0,0,0,.65));

    animation:
        heartAppear 1.3s cubic-bezier(.22,1,.36,1) both;
}

.heart::before,
.heart::after{
    content:"";
    position:absolute;

    width:108px;
    height:96px;

    border-radius:60px 60px 0 0;

    background:
        linear-gradient(
            145deg,
            #292929 0%,
            #111 45%,
            #050505 100%
        );

    border:1px solid rgba(255,255,255,.11);
}

.heart::before{
    top:-54px;
    left:0;

    transform:rotate(90deg);
    transform-origin:bottom right;
}

.heart::after{
    top:0;
    left:54px;

    transform:rotate(0deg);
}

.heart-inner{
    position:absolute;
    z-index:5;

    width:108px;
    height:96px;

    top:0;
    left:0;

    overflow:hidden;

    pointer-events:none;
}

.heart-inner::after{
    content:"";

    position:absolute;

    left:8px;
    top:8px;

    width:48px;
    height:15px;

    border-radius:50%;

    background:rgba(255,255,255,.10);

    filter:blur(8px);

    transform:rotate(45deg);
}

/* Crack */

.crack{
    position:absolute;
    z-index:20;

    width:4px;
    height:77px;

    left:53px;
    top:-5px;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(255,255,255,.55) 13%,
            rgba(255,255,255,.2) 40%,
            rgba(255,255,255,.48) 64%,
            transparent 100%
        );

    clip-path:
        polygon(
            45% 0%,
            72% 19%,
            43% 34%,
            68% 52%,
            39% 72%,
            61% 100%,
            35% 79%,
            20% 59%,
            46% 40%,
            24% 22%
        );

    transform:rotate(45deg);

    opacity:.85;
}

/* =========================
   TEXT
========================= */

.eyebrow{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    margin-bottom:16px;

    color:rgba(255,255,255,.42);

    font-size:11px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
}

.eyebrow-line{
    width:24px;
    height:1px;

    background:rgba(255,255,255,.24);
}

.title{
    width:100%;

    font-size:
        clamp(38px, 7vw, 72px);

    line-height:1.02;

    font-weight:700;
    letter-spacing:-2.8px;

    color:#f4f4f4;

    text-shadow:
        0 0 35px rgba(255,255,255,.045);

    margin-bottom:18px;
}

.title span{
    color:#777;
    font-weight:500;
}

.subtitle{
    max-width:570px;

    color:rgba(255,255,255,.46);

    font-size:
        clamp(14px, 2vw, 17px);

    line-height:1.7;

    font-weight:400;

    margin:0 auto;
}

/* =========================
   DIVIDER
========================= */

.divider{
    width:min(300px, 70%);

    height:1px;

    margin:34px auto 25px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.17),
            transparent
        );

    position:relative;
}

.divider::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:rgba(255,255,255,.4);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 12px rgba(255,255,255,.25);
}

/* =========================
   FOOTER
========================= */

.footer{
    color:rgba(255,255,255,.25);

    font-size:11px;

    letter-spacing:2.5px;

    text-transform:uppercase;

    line-height:1.7;
}

.footer strong{
    color:rgba(255,255,255,.38);
    font-weight:600;
}

/* =========================
   CORNER FRAME
========================= */

.frame{
    position:fixed;
    z-index:2;
    inset:22px;

    border:1px solid rgba(255,255,255,.035);

    pointer-events:none;
}

.frame::before,
.frame::after{
    content:"";

    position:absolute;

    width:35px;
    height:35px;

    border-color:rgba(255,255,255,.12);
    border-style:solid;
}

.frame::before{
    left:-1px;
    top:-1px;

    border-width:1px 0 0 1px;
}

.frame::after{
    right:-1px;
    bottom:-1px;

    border-width:0 1px 1px 0;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes contentEnter{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes heartAppear{
    from{
        opacity:0;
        transform:
            rotate(-45deg)
            scale(.65);
    }

    to{
        opacity:1;
        transform:
            rotate(-45deg)
            scale(1);
    }
}

@keyframes heartFloat{
    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-9px);
    }
}

@keyframes heartGlow{
    0%,
    100%{
        opacity:.55;
        transform:scale(.94);
    }

    50%{
        opacity:1;
        transform:scale(1.07);
    }
}

@keyframes ambientPulse{
    0%,
    100%{
        opacity:.55;
        transform:
            translate(-50%,-50%)
            scale(.95);
    }

    50%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.06);
    }
}

@keyframes floatParticle{
    0%{
        opacity:0;
        transform:translateY(20px);
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.7;
    }

    100%{
        opacity:0;
        transform:translateY(-80px);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:
            28px 20px;
    }

    .frame{
        inset:12px;
    }

    .heart-wrapper{
        width:155px;
        height:155px;
        margin-bottom:28px;
    }

    .heart{
        transform:
            rotate(-45deg)
            scale(.82);
    }

    .crack{
        transform:
            rotate(45deg)
            scale(.82);
    }

    .title{
        letter-spacing:-1.7px;
        margin-bottom:15px;
    }

    .subtitle{
        font-size:14px;
        line-height:1.65;
    }

    .divider{
        margin-top:27px;
        margin-bottom:20px;
    }

    .footer{
        font-size:9px;
        letter-spacing:2px;
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="background">

    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

</div>

<!-- Subtle cinematic frame -->
<div class="frame"></div>

<!-- Main Content -->
<main class="page">

    <section class="content">

        <!-- Broken Heart -->
        <div class="heart-wrapper">

            <div class="heart-glow"></div>

            <div class="heart">

                <div class="heart-inner"></div>

                <div class="crack"></div>

            </div>

        </div>

        <!-- Small Label -->
        <div class="eyebrow">
            <span class="eyebrow-line"></span>
            End of an Era
            <span class="eyebrow-line"></span>
        </div>

        <!-- Main Heading -->
        <h1 class="title">
            SehrAn Media
            <span>is Permanently Closed</span>
        </h1>

        <!-- Description -->
        <p class="subtitle">
            Some stories reach their final frame.
            <br>
            Thank you for being part of ours.
        </p>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Footer -->
        <div class="footer">
            <strong>SehrAn Media</strong>
            &nbsp;•&nbsp;
            The final chapter
        </div>

    </section>

</main>

</body>
</html>
