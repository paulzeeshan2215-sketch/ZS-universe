```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SehrAn Media — Permanently Closed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Inter,Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #17233d 0%,
            #0a1020 42%,
            #02050d 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   BACKGROUND GLOW
========================= */

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(82,113,255,.15),
            rgba(110,65,255,.07),
            transparent 70%
        );

    filter:blur(30px);
    pointer-events:none;
}

/* =========================
   FLOATING PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#7896ff;
    opacity:.35;

    animation:
        particleFloat 7s ease-in-out infinite;
}

.particle:nth-child(1){
    left:8%;
    top:18%;
}

.particle:nth-child(2){
    left:18%;
    top:70%;
    animation-delay:1s;
}

.particle:nth-child(3){
    left:82%;
    top:22%;
    animation-delay:2s;
}

.particle:nth-child(4){
    left:92%;
    top:65%;
    animation-delay:3s;
}

.particle:nth-child(5){
    left:28%;
    top:30%;
    animation-delay:4s;
}

.particle:nth-child(6){
    left:72%;
    top:78%;
    animation-delay:2.5s;
}

.particle:nth-child(7){
    left:52%;
    top:12%;
    animation-delay:1.5s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translate(0,0);
        opacity:.2;
    }

    50%{
        transform:translate(18px,-30px);
        opacity:.8;
    }
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    position:relative;
    width:min(900px,94%);
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px 15px;
}

/* =========================
   ROBOT AREA
========================= */

.robot-area{
    position:relative;
    width:330px;
    height:330px;

    animation:
        robotFloat 4.5s ease-in-out infinite;
}

@keyframes robotFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-14px);
    }
}

/* =========================
   BROKEN HEART
========================= */

.broken-heart{
    position:absolute;
    z-index:10;

    top:-5px;
    right:5px;

    width:90px;
    height:80px;

    font-size:72px;
    line-height:80px;

    color:#ff536e;

    filter:
        drop-shadow(0 0 12px rgba(255,60,95,.5));

    animation:
        heartFloat 3s ease-in-out infinite;
}

@keyframes heartFloat{

    0%,100%{
        transform:translateY(0) rotate(3deg);
    }

    50%{
        transform:translateY(-10px) rotate(-4deg);
    }
}

/* =========================
   ROBOT
========================= */

.robot{
    position:absolute;

    width:210px;
    height:245px;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);
}

/* Robot antenna */

.antenna{
    position:absolute;

    width:6px;
    height:30px;

    background:#aeb8ca;

    left:50%;
    top:-25px;

    transform:translateX(-50%);

    border-radius:10px;
}

.antenna::before{
    content:"";

    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#91a5ff;

    left:50%;
    top:-8px;

    transform:translateX(-50%);

    box-shadow:
        0 0 15px #718bff;

    animation:
        antennaPulse 2s infinite;
}

@keyframes antennaPulse{

    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.3);
    }
}

/* Robot head */

.robot-head{
    position:absolute;

    width:190px;
    height:135px;

    left:50%;
    top:0;

    transform:translateX(-50%);

    border-radius:55px 55px 48px 48px;

    background:
        linear-gradient(
            145deg,
            #f8faff,
            #b8c2d0
        );

    border:5px solid #8d99ab;

    box-shadow:
        inset 0 -8px 15px rgba(0,0,0,.12),
        0 18px 35px rgba(0,0,0,.35);
}

/* Robot screen */

.robot-screen{
    position:absolute;

    width:145px;
    height:82px;

    left:50%;
    top:28px;

    transform:translateX(-50%);

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            #111a2c,
            #050a14
        );

    border:4px solid #667389;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.8),
        0 0 15px rgba(90,110,180,.12);
}

/* Sad eyes */

.eye{
    position:absolute;

    width:17px;
    height:24px;

    top:24px;

    border-radius:50%;

    background:#5c8cff;

    box-shadow:
        0 0 12px rgba(80,130,255,.8);

    animation:
        eyeBlink 4s infinite;
}

.eye.left{
    left:38px;
}

.eye.right{
    right:38px;
}

@keyframes eyeBlink{

    0%,44%,48%,100%{
        transform:scaleY(1);
    }

    46%{
        transform:scaleY(.15);
    }
}

/* Sad mouth */

.mouth{
    position:absolute;

    width:38px;
    height:20px;

    left:50%;
    bottom:13px;

    transform:translateX(-50%);

    border-top:4px solid #5c8cff;

    border-radius:50%;

    filter:
        drop-shadow(0 0 5px rgba(80,130,255,.7));
}

/* Robot ears */

.ear{
    position:absolute;

    width:24px;
    height:50px;

    top:42px;

    background:#aab5c4;

    border:4px solid #7d899c;

    border-radius:12px;
}

.ear.left{
    left:-18px;
}

.ear.right{
    right:-18px;
}

/* Robot body */

.robot-body{
    position:absolute;

    width:145px;
    height:100px;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    border-radius:35px 35px 28px 28px;

    background:
        linear-gradient(
            145deg,
            #e8edf4,
            #a7b2c1
        );

    border:5px solid #7e8b9d;

    box-shadow:
        inset 0 -8px 15px rgba(0,0,0,.12),
        0 15px 30px rgba(0,0,0,.35);
}

/* Body light */

.body-light{
    position:absolute;

    width:24px;
    height:24px;

    border-radius:50%;

    left:50%;
    top:28px;

    transform:translateX(-50%);

    background:#7895ff;

    box-shadow:
        0 0 18px rgba(90,125,255,.8);

    animation:
        bodyPulse 2.5s infinite;
}

@keyframes bodyPulse{

    0%,100%{
        opacity:.55;
        transform:translateX(-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translateX(-50%) scale(1.2);
    }
}

/* Robot arms */

.arm{
    position:absolute;

    width:30px;
    height:80px;

    bottom:8px;

    background:#b9c3d0;

    border:4px solid #7f8b9c;

    border-radius:20px;

    transform-origin:top center;
}

.arm.left{
    left:7px;
    transform:rotate(25deg);
}

.arm.right{
    right:7px;
    transform:rotate(-25deg);
}

/* Hands */

.hand{
    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    background:#d8dee7;

    border:4px solid #7d899a;

    bottom:-15px;
}

.arm.left .hand{
    left:-5px;
}

.arm.right .hand{
    right:-5px;
}

/* =========================
   CLOSED MESSAGE
========================= */

.status{
    margin-top:15px;

    padding:8px 17px;

    border:1px solid rgba(112,140,255,.35);

    border-radius:50px;

    background:rgba(55,75,130,.12);

    color:#91a8ff;

    font-size:12px;
    font-weight:800;

    letter-spacing:2px;

    animation:
        statusPulse 3s infinite;
}

@keyframes statusPulse{

    0%,100%{
        box-shadow:0 0 10px rgba(100,130,255,.05);
    }

    50%{
        box-shadow:0 0 25px rgba(100,130,255,.2);
    }
}

h1{
    margin-top:20px;

    line-height:1.05;

    font-weight:900;

    letter-spacing:-2px;
}

.site-name{
    display:block;

    font-size:clamp(38px,7vw,70px);

    color:#f5f7fb;
}

.closed{
    display:block;

    margin-top:7px;

    font-size:clamp(27px,5vw,50px);

    background:
        linear-gradient(
            90deg,
            #668cff,
            #9d69ff,
            #c15cff,
            #668cff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s linear infinite;
}

@keyframes gradientMove{

    from{
        background-position:0% center;
    }

    to{
        background-position:300% center;
    }
}

/* Divider */

.divider{
    width:min(560px,80%);

    height:1px;

    margin:25px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,130,255,.5),
            transparent
        );

    position:relative;
}

.divider::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#7592ff;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 15px #7592ff;
}

/* Description */

.description{
    margin-top:22px;

    color:#929caf;

    font-size:17px;

    line-height:1.5;
}

/* =========================
   HOME BUTTON
========================= */

.home-btn{
    margin-top:27px;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    padding:14px 28px;

    min-width:205px;

    color:#eef2ff;

    text-decoration:none;

    font-size:16px;
    font-weight:800;

    border:1px solid #718cff;

    border-radius:14px;

    background:
        rgba(65,85,160,.12);

    box-shadow:
        0 8px 25px rgba(50,80,190,.12);

    transition:
        .3s ease;
}

.home-btn:hover{
    transform:translateY(-5px);

    background:
        rgba(80,105,200,.22);

    box-shadow:
        0 15px 35px rgba(70,100,230,.25);
}

.home-icon{
    font-size:22px;
}

/* Footer */

footer{
    margin-top:25px;

    color:#535d72;

    font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .container{
        min-height:100vh;
        padding:25px 12px;
    }

    .robot-area{
        transform:scale(.82);
        margin-bottom:-30px;
    }

    .site-name{
        font-size:40px;
    }

    .closed{
        font-size:27px;
    }

    .description{
        font-size:15px;
    }

    .home-btn{
        width:85%;
    }
}

/* Accessibility */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<!-- Background particles -->

<div class="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

</div>


<main class="container">


    <!-- =========================
         SAD ROBOT
    ========================== -->

    <div class="robot-area">

        <!-- Broken Heart -->

        <div class="broken-heart">
            💔
        </div>


        <div class="robot">

            <!-- Antenna -->

            <div class="antenna"></div>


            <!-- Head -->

            <div class="robot-head">

                <div class="ear left"></div>

                <div class="robot-screen">

                    <div class="eye left"></div>

            <div class="arm left">

</body>
</html>
