<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SehrAn Media</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.screen {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      #160d20 0%,
      #050507 45%,
      #000000 100%
    );

  overflow: hidden;
}

.finger-container {
  position: relative;

  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  perspective: 1000px;
}

.glow {
  position: absolute;

  width: 55vw;
  height: 55vw;

  max-width: 500px;
  max-height: 500px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(185, 55, 255, 0.45) 0%,
      rgba(125, 25, 255, 0.20) 35%,
      transparent 72%
    );

  filter: blur(45px);

  opacity: 0;

  transform: scale(0.2);

  animation:
    glowIn 1.3s
    cubic-bezier(.15,1.4,.3,1)
    0.7s
    forwards;
}

.finger {
  position: relative;

  font-size: min(65vw, 440px);

  line-height: 1;

  user-select: none;
  -webkit-user-select: none;

  opacity: 0;

  transform:
    scale(0.05)
    rotate(-35deg)
    translateY(80px);

  filter:
    blur(12px)
    drop-shadow(
      0 0 25px
      rgba(255,255,255,0.18)
    );

  animation:
    fingerReveal
    1.35s
    cubic-bezier(.12,1.55,.28,1)
    0.9s
    forwards;
}

/* Cinematic light flash */

.flash {
  position: absolute;
  inset: 0;

  background: white;

  opacity: 0;

  pointer-events: none;

  animation:
    flashEffect
    0.7s
    ease
    1.05s
    forwards;
}

/* Final subtle pulse */

.finger-container::after {
  content: "";

  position: absolute;

  width: 25vw;
  height: 25vw;

  max-width: 220px;
  max-height: 220px;

  border-radius: 50%;

  border: 2px solid
    rgba(210, 90, 255, 0.25);

  opacity: 0;

  transform: scale(0.2);

  pointer-events: none;

  animation:
    pulseRing
    1.5s
    ease-out
    1.45s
    forwards;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fingerReveal {

  0% {
    opacity: 0;

    transform:
      scale(0.05)
      rotate(-35deg)
      translateY(80px);

    filter:
      blur(12px)
      drop-shadow(
        0 0 0
        rgba(255,255,255,0)
      );
  }

  35% {
    opacity: 1;

    transform:
      scale(1.18)
      rotate(8deg)
      translateY(-8px);

    filter:
      blur(2px)
      drop-shadow(
        0 0 45px
        rgba(190,70,255,0.55)
      );
  }

  55% {
    transform:
      scale(0.92)
      rotate(-4deg)
      translateY(3px);
  }

  72% {
    transform:
      scale(1.06)
      rotate(2deg)
      translateY(-2px);
  }

  88% {
    transform:
      scale(0.98)
      rotate(-1deg);
  }

  100% {
    opacity: 1;

    transform:
      scale(1)
      rotate(0deg)
      translateY(0);

    filter:
      blur(0)
      drop-shadow(
        0 0 35px
        rgba(190,70,255,0.45)
      );
  }
}

@keyframes glowIn {

  0% {
    opacity: 0;
    transform: scale(0.2);
  }

  45% {
    opacity: 0.85;
    transform: scale(1.15);
  }

  100% {
    opacity: 0.45;
    transform: scale(1);
  }
}

@keyframes flashEffect {

  0% {
    opacity: 0;
  }

  45% {
    opacity: 0.16;
  }

  100% {
    opacity: 0;
  }
}

@keyframes pulseRing {

  0% {
    opacity: 0;
    transform: scale(0.2);
  }

  30% {
    opacity: 0.7;
    transform: scale(1);
  }

  100% {
    opacity: 0;
    transform: scale(2.8);
  }
}

/* Mobile */

@media (max-width: 500px) {

  .finger {
    font-size: 72vw;
  }

  .glow {
    width: 75vw;
    height: 75vw;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="finger-container">

    <div class="glow"></div>

    <div class="flash"></div>

    <div class="finger">
      🖕
    </div>

  </div>

</div>

</body>
</html>
