<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .prank-screen {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #090909 45%,
          #000000 100%
        );
      position: relative;
    }

    .middle-finger {
      font-size: min(65vw, 65vh);
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      animation: prankPop 0.8s ease-out;
      filter:
        drop-shadow(0 0 25px rgba(255,255,255,0.15))
        drop-shadow(0 0 70px rgba(255,0,80,0.12));
    }

    @keyframes prankPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      60% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .corner-text {
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="prank-screen">
    <div class="middle-finger">🖕</div>

    <div class="corner-text">
      SehrAn Media
    </div>
  </main>

</body>
</html>
