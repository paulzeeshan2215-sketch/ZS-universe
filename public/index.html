<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Permanently Closed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 25%, #12182d 0%, #070b19 42%, #02040d 100%);
    color:#fff;
    overflow-x:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    left:50%;
    top:15%;
    transform:translateX(-50%);
    background:radial-gradient(
        circle,
        rgba(112,63,255,.13),
        rgba(255,45,110,.04),
        transparent 70%
    );
    filter:blur(20px);
    pointer-events:none;
}

/* Floating particles */
.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#9a75ff;
    opacity:.45;
    animation:floatParticle 7s ease-in-out infinite;
}

.particle:nth-child(1){left:8%;top:18%;animation-delay:0s}
.particle:nth-child(2){left:22%;top:40%;animation-delay:1s}
.particle:nth-child(3){left:78%;top:25%;animation-delay:2s}
.particle:nth-child(4){left:88%;top:50%;animation-delay:3s}
.particle:nth-child(5){left:15%;top:70%;animation-delay:4s}
.particle:nth-child(6){left:72%;top:75%;animation-delay:2.5s}
.particle:nth-child(7){left:93%;top:14%;animation-delay:1.5s}

@keyframes floatParticle{
    0%,100%{
        transform:translateY(0) translateX(0);
        opacity:.25;
    }

    50%{
        transform:translateY(-30px) translateX(15px);
        opacity:.8;
    }
}

/* Main */
.container{
    position:relative;
    width:100%;
    max-width:1000px;
    margin:auto;
    min-height:100vh;
    padding:55px 20px 35px;
    text-align:center;
}

/* Illustration area */
.illustration{
    position:relative;
    width:min(850px,100%);
    margin:0 auto 35px;
    animation:mainFloat 5s ease-in-out infinite;
}

.illustration img{
    display:block;
    width:100%;
    height:auto;
    border-radius:25px;
    filter:
        drop-shadow(0 20px 40px rgba(0,0,0,.65))
        drop-shadow(0 0 30px rgba(105,65,255,.08));
}

/*
   Floating animation
*/
@keyframes mainFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

/* Lock icon */
.lock-section{
    margin-top:-5px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.line{
    width:140px;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        #814cff,
        #c03b88
    );
}

.lock{
    width:105px;
    height:105px;
    border-radius:50%;
    border:3px solid #8d55ff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;

    background:
        radial-gradient(
            circle,
            rgba(142,75,255,.20),
            rgba(20,10,50,.5)
        );

    box-shadow:
        0 0 25px rgba(132,72,255,.35),
        inset 0 0 25px rgba(255,50,130,.12);

    animation:lockPulse 3s ease-in-out infinite;
}

.lock::before{
    content:"";
    position:absolute;
    width:27px;
    height:30px;
    border:7px solid #b56aff;
    border-bottom:0;
    border-radius:18px 18px 0 0;
    top:22px;
}

.lock::after{
    content:"🔒";
    position:absolute;
    font-size:32px;
    filter:grayscale(1) brightness(1.8);
    top:39px;
}

@keyframes lockPulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
            0 0 25px rgba(132,72,255,.35);
    }

    50%{
        transform:scale(1.05);
        box-shadow:
            0 0 45px rgba(175,65,255,.55);
    }
}

/* Heading */
h1{
    margin-top:22px;
    font-size:clamp(38px,7vw,76px);
    font-weight:900;
    letter-spacing:-2px;
    line-height:1.05;
}

.heading-white{
    display:block;
    color:#f4f4f7;
}

.heading-gradient{
    display:block;
    background:linear-gradient(
        90deg,
        #7651ff,
        #b93bd0,
        #ff405d
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradientMove 5s ease-in-out infinite;
    background-size:200% auto;
}

@keyframes gradientMove{
    0%,100%{
        background-position:0% center;
    }

    50%{
        background-position:100% center;
    }
}

/* Description */
.description{
    max-width:650px;
    margin:28px auto 0;
    color:#a9a9bc;
    font-size:20px;
    line-height:1.7;
}

.support{
    margin-top:32px;
    color:#aaaabd;
    font-size:18px;
}

/* Heart */
.heart-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin:28px 0;
}

.heart-line{
    width:180px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #c9387b
    );
}

.heart{
    font-size:38px;
    color:#ff4565;
    animation:heartBeat 1.8s infinite;
    filter:drop-shadow(0 0 10px rgba(255,55,90,.5));
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.12);
    }
}

/* Home button */
.home-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:14px;

    margin-top:25px;
    padding:17px 32px;

    color:#e5e5ee;
    text-decoration:none;

    font-size:18px;
    font-weight:800;
    letter-spacing:.5px;

    border:2px solid transparent;
    border-radius:18px;

    background:
        linear-gradient(#090d1c,#090d1c) padding-box,
        linear-gradient(
            90deg,
            #7145ff,
            #d33a91,
            #ff4d64
        ) border-box;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.home-btn:hover{
    transform:translateY(-5px);
    box-shadow:
        0 12px 35px rgba(113,69,255,.25),
        0 0 25px rgba(255,60,100,.12);
}

.home-icon{
    font-size:25px;
}

/* Footer */
footer{
    margin-top:50px;
    color:#686a80;
    font-size:16px;
}

/* Responsive */
@media(max-width:600px){

    .container{
        padding:25px 14px 25px;
    }

    .illustration{
        margin-bottom:25px;
    }

    .lock{
        width:80px;
        height:80px;
    }

    .lock::before{
        transform:scale(.8);
        top:15px;
    }

    .lock::after{
        font-size:25px;
        top:29px;
    }

    .line{
        width:70px;
    }

    h1{
        font-size:40px;
        letter-spacing:-1px;
    }

    .description{
        font-size:17px;
        line-height:1.6;
    }

    .support{
        font-size:16px;
    }

    .heart-line{
        width:80px;
    }

    .home-btn{
        width:90%;
        font-size:16px;
    }
}
</style>
</head>


<body>

<!-- Floating particles -->
<div class="particles">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
</div>


<main class="container">

    <!--
        अपनी reference image को
        "closed-page.png" नाम से index.html के साथ रखें।
    -->
    <div class="illustration">
        <img
            src="closed-page.png"
            alt="Website permanently closed"
        >
    </div>


    <!-- Lock -->
    <div class="lock-section">

        <span class="line"></span>

        <div class="lock"></div>

        <span class="line"></span>

    </div>


    <!-- Main Heading -->
    <h1>
        <span class="heading-white">
            WEBSITE
        </span>

        <span class="heading-gradient">
            PERMANENTLY CLOSED
        </span>
    </h1>


    <!-- Description -->
    <p class="description">
        Thank you for being part of our journey.<br>
        This website is no longer available and<br>
        has been permanently closed.
    </p>


    <p class="support">
        We appreciate your support and memories.
    </p>


    <!-- Heart -->
    <div class="heart-area">

        <span class="heart-line"></span>

        <div class="heart">♥</div>

        <span class="heart-line"></span>

    </div>


    <!-- Home -->
    <a href="/" class="home-btn">
        <span class="home-icon">⌂</span>
        <span>GO BACK HOME</span>
    </a>


    <!-- Footer -->
    <footer>
        © 2026 ZeeshanPlayzone- — Thank you!
    </footer>

</main>

</body>
</html>
